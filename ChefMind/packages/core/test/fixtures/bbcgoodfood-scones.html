<script data-testid="page-schema" type="application/ld+json">{"@context":"https://schema.org","@id":"https://www.bbcgoodfood.com/recipes/classic-scones-jam-clotted-cream#Recipe","@type":"Recipe","description":"You can have a batch of scones on the table in 20 minutes with Jane Hornby's storecupboard recipe, perfect for unexpected guests","image":[{"@type":"ImageObject","url":"https://images.immediate.co.uk/production/volatile/sites/30/2020/08/recipe-image-legacy-id-1001500_10-16f94ee.jpg?resize=440,400","width":440,"height":400}],"mainEntityOfPage":{"@type":"WebPage","@id":"https://www.bbcgoodfood.com/recipes/classic-scones-jam-clotted-cream"},"name":"Classic scones with jam & clotted cream","url":"https://www.bbcgoodfood.com/recipes/classic-scones-jam-clotted-cream","author":[{"@type":"Person","name":"Jane Hornby","url":"https://www.bbcgoodfood.com/author/janehornby"}],"dateModified":"2025-03-31T17:45:10+01:00","datePublished":"2025-03-31T17:45:10+01:00","headline":"Classic scones with jam & clotted cream","keywords":"20 minutes, Classic, Clotted cream, Cream tea, English, Garden party, Jane Hornby, Lemon juice, Make ahead, Quick, Scones, Scrumptious, Tea party","publisher":{"@type":"Organization","name":"Good Food","url":"https://www.bbcgoodfood.com","logo":{"@type":"ImageObject","height":325,"url":"https://images.immediate.co.uk/production/volatile/sites/30/2026/02/goodfood.logo-f37096c.png?resize=1312,325","width":1312}},"cookTime":"PT10M","nutrition":{"@type":"NutritionInformation","calories":"285 calories","fatContent":"10 grams fat","saturatedFatContent":"6 grams saturated fat","carbohydrateContent":"42.02 grams carbohydrates","sugarContent":"9 grams sugar","fiberContent":"2 grams fiber","proteinContent":"5 grams protein","sodiumContent":"0.74 milligram of sodium"},"recipeCategory":"Afternoon tea, Breakfast, Snack, Treat","recipeCuisine":"British","recipeIngredient":["350g self-raising flour plus more for dusting","1 tsp baking powder","85g butter cut into cubes","3 tbsp caster sugar","175ml milk","1 tsp vanilla extract","squeeze lemon juice (see tips below)","beaten egg to glaze","jam and clotted cream to serve"],"recipeInstructions":[{"@type":"HowToStep","text":"Heat the oven to 220C/200C fan/gas 7. Tip the self-raising flour into a large bowl with ¼ tsp salt and the baking powder, then mix."},{"@type":"HowToStep","text":"Add the butter, then rub in with your fingers until the mix looks like fine crumbs. Stir in the caster sugar."},{"@type":"HowToStep","text":"Put the milk into a jug and heat in the microwave for about 30 secs until warm, but not hot. Add the vanilla extract and a squeeze of lemon juice, then set aside for a moment."},{"@type":"HowToStep","text":"Put a baking tray in the oven. Make a well in the dry mix, then add the liquid and combine it quickly with a cutlery knife – it will seem pretty wet at first."},{"@type":"HowToStep","text":"Scatter some flour onto the work surface and tip the dough out. Dredge the dough and your hands with a little more flour, then fold the dough over 2-3 times until it’s a little smoother. Pat into a round about 4cm deep. Take a 5cm cutter (smooth-edged cutters tend to cut more cleanly, giving a better rise) and dip it into some flour. Plunge into the dough, then repeat until you have four scones. You may need to press what’s left of the dough back into a round to cut out another four."},{"@type":"HowToStep","text":"Brush the tops with a beaten egg, then carefully arrange on the hot baking tray. Bake for 10 mins until risen and golden on the top. Eat just warm or cold on the day of baking, generously topped with jam and clotted cream. If freezing, freeze once cool. Defrost, then put in a low oven (about 160C/140C fan/gas 3) for a few minutes to refresh."}],"recipeYield":8,"suitableForDiet":"https://schema.org/VegetarianDiet","totalTime":"PT15M"}</script>
