# CalMind Desktop for Windows — manual only. Tauri cannot cross-compile from
# the Mac, so this job builds the .msi/.exe on a windows runner from the
# same web export the site serves. Trigger it from the Actions tab when a
# Windows build is actually wanted; it never runs on push.
name: desktop-windows
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: npm ci
      - name: Export the web app
        run: npm -w app exec expo export -- -p web
      - name: Build the Windows bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CalMind-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
