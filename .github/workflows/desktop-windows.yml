# CalMind Desktop for Windows — manual only. Tauri cannot cross-compile from
# the Mac, so this job builds the .msi/.exe on a windows runner from the
# same web export the site serves. Trigger it from the Actions tab when a
# Windows build is actually wanted; it never runs on push.
name: desktop-windows
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: npm ci
      # export:web, not a bare `expo export` — the head patch rides in it, and
      # the Windows bundle should carry the same index.html the site serves.
      - name: Export the web app
        run: npm run export:web
      - name: Build the Windows bundle
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CalMind-windows
          # error, not the default warn: this job's first "success" uploaded
          # NOTHING (bundle.targets said only "app", which is macOS's), and a
          # green run with no artifact is the kind of check that cannot fail.
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
